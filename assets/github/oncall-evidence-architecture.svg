    </g>
    <path d="M305 863H323" fill="none" stroke="#287C78" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M590 863H608" fill="none" stroke="#287C78" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M875 863H893" fill="none" stroke="#287C78" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="946" font-size="20">Editorial associations confer no sponsorship, endorsement, clinical validation or investment analysis.</text>

    <path d="M40 978H1160" stroke="#183C3C" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="40" y="1015" font-size="18" font-weight="700" letter-spacing="1">SEPARATE TECHNICAL BRANCH / NO SCIENTIFIC VALIDATION</text>
    <rect x="40" y="1037" width="340" height="66" fill="#C69C72"/>
    <text x="210" y="1078" text-anchor="middle" font-size="23" font-weight="700">SELECTED PAIR SET</text>
    <path d="M380 1070H430" stroke="#183C3C" stroke-width="3" marker-end="url(#ink-arrow)"/>
    <rect x="440" y="1037" width="375" height="66" fill="#ED806B"/>
    <text x="627" y="1078" text-anchor="middle" font-size="23" font-weight="700">PAR CHECK: PENDING</text>
    <text x="843" y="1062" font-size="20">Priceability + routes</text><text x="843" y="1090" font-size="20">+ in-range depth</text>
    <text x="40" y="1145" font-size="21" font-weight="700">Failed technical check → launch blocked. No silent substitution.</text>
    <text x="40" y="1180" font-size="20">Changing the selected set requires a documented public decision.</text>
  </g>
</svg>
